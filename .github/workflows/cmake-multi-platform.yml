name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - 'test-*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            artifact_name: bsp-windows.exe
            build_path: build/Release/bsp.exe
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            artifact_name: bsp-linux
            build_path: build/bsp

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config Release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ github.workspace }}/${{ matrix.build_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/test-')
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: bsp-windows.exe
        path: ./artifacts/windows

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: bsp-linux
        path: ./artifacts/linux

    - name: Get version from tag
      id: get_version
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        # Handle test- tags
        if [[ "$TAG_NAME" == test-* ]]; then
          VERSION=${TAG_NAME}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          echo "DRAFT=true" >> $GITHUB_OUTPUT
        # Handle v* tags
        else
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # All releases start as draft - manually publish after testing
          echo "DRAFT=true" >> $GITHUB_OUTPUT
          # Check if this is a pre-release (contains rc, alpha, beta, etc.)
          if [[ "$VERSION" =~ (rc|alpha|beta|dev) ]]; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Package Windows release
      run: |
        mkdir -p release/windows
        cp artifacts/windows/bsp.exe release/windows/
        cp README.md release/windows/
        cd release/windows
        zip -r ../../bsp-${{ steps.get_version.outputs.VERSION }}-windows-x64.zip .
        cd ../..
        sha256sum bsp-${{ steps.get_version.outputs.VERSION }}-windows-x64.zip > bsp-${{ steps.get_version.outputs.VERSION }}-windows-x64.zip.sha256

    - name: Package Linux release
      run: |
        mkdir -p release/linux
        cp artifacts/linux/bsp release/linux/
        chmod +x release/linux/bsp
        cp README.md release/linux/
        cd release/linux
        tar czf ../../bsp-${{ steps.get_version.outputs.VERSION }}-linux-x64.tar.gz .
        cd ../..
        sha256sum bsp-${{ steps.get_version.outputs.VERSION }}-linux-x64.tar.gz > bsp-${{ steps.get_version.outputs.VERSION }}-linux-x64.tar.gz.sha256

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          bsp-${{ steps.get_version.outputs.VERSION }}-windows-x64.zip
          bsp-${{ steps.get_version.outputs.VERSION }}-windows-x64.zip.sha256
          bsp-${{ steps.get_version.outputs.VERSION }}-linux-x64.tar.gz
          bsp-${{ steps.get_version.outputs.VERSION }}-linux-x64.tar.gz.sha256
        draft: ${{ steps.get_version.outputs.DRAFT }}
        prerelease: ${{ steps.get_version.outputs.PRERELEASE }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
